<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FF9F1C" />
    <!-- Redundant with the _headers file's CSP on Cloudflare (that one wins
         when both are present). Kept here too so script/style/img/connect
         restrictions still apply even on a host with no custom-header
         support (e.g. GitHub Pages) -- though frame-ancestors, HSTS, and the
         other _headers-only protections can't be replicated this way. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'"
    />
    <title>かん字マスター 小2 - 漢字練習アプリ</title>
    <meta
      name="description"
      content="小学2年生が習う漢字を、書き順を確認しながら楽しく練習できるWebアプリ。"
    />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header id="app-header" class="app-header"></header>

      <main id="app-main" class="app-main">
        <aside id="kanji-grid" class="kanji-grid-panel"></aside>
        <section id="drawing-canvas-wrap" class="drawing-canvas-wrap"></section>
        <aside id="kanji-info-card" class="kanji-info-panel"></aside>
      </main>

      <footer id="app-footer" class="app-footer"></footer>
    </div>

    <canvas id="confetti-canvas" class="confetti-canvas" width="600" height="600"></canvas>
    <div id="toast" class="toast hidden"></div>

    <div id="category-modal" class="modal-overlay hidden"></div>
    <div id="all-kanji-modal" class="modal-overlay hidden"></div>
    <div id="test-results-modal" class="modal-overlay hidden"></div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
