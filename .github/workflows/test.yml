name: Tests

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege default: this workflow only reads the repo and runs
# tests, so the GITHUB_TOKEN it's handed needs no write access at all --
# matters more once the repo (and its PRs-from-forks) are public.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test
