name = "kanji-sample"
compatibility_date = "2024-11-01"

# If you deploy with the classic Pages CLI, this key is used:
#   npx wrangler pages deploy public
pages_build_output_dir = "public"

# This is a plain static HTML/CSS/JS app (no build step). The served files
# live in public/ -- everything else in the repo (tests/, tools/, docs/,
# package.json, ...) is dev-only and never uploaded, so no .assetsignore
# excludelist is needed.
#
# Cloudflare's dashboard "Connect to Git" flow creates a Workers project for
# repos with a wrangler.toml and runs `wrangler deploy`, which reads this
# [assets] block to serve the given directory as a static site (no Worker
# script needed). Must come last -- TOML table headers apply to every key
# below them, so anything after [assets] would otherwise be nested inside it.
[assets]
directory = "public"
